version: 1
applications:
  - appRoot: client
    frontend:
      phases:
        preBuild:
          commands:
            # Install root workspace dependencies
            - cd .. && npm ci
        build:
          commands:
            # Build shared package first, then client bundle
            - npm run build --workspace=shared
            - npm run build --workspace=client
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - ../node_modules/**/*
          - node_modules/**/*
      customHeaders:
        - pattern: '**/*'
          headers:
            - key: 'X-Frame-Options'
              value: 'DENY'
            - key: 'X-Content-Type-Options'
              value: 'nosniff'
            - key: 'Referrer-Policy'
              value: 'strict-origin-when-cross-origin'
            - key: 'Permissions-Policy'
              value: 'camera=(), microphone=(), geolocation=()'
