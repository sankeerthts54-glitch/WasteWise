version: 1.0
runtime: nodejs20
build:
  commands:
    build:
      - npm ci
      - npm run build --workspace=shared
      - npm run build --workspace=server
      - npm prune --omit=dev
run:
  runtime-version: 20
  command: node server/dist/index.js
  network:
    port: 4000
    env: APP_PORT
  health-check:
    path: /api/health
    interval: 10
    timeout: 5
    healthy-threshold: 1
    unhealthy-threshold: 3
