version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd .. && npm ci
    build:
      commands:
        - npm run build --workspace=shared
        - npm run build --workspace=client
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - ../node_modules/**/*
      - node_modules/**/*
