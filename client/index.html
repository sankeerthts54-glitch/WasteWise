<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WasteWise — AI-Powered Waste &amp; Energy Advisor</title>
    <meta name="description" content="Get personalised AI-generated waste management and energy plans for your home or business." />
    <meta name="theme-color" content="#064e3b" />
    <meta property="og:title" content="WasteWise — AI Waste &amp; Energy Advisor" />
    <meta property="og:description" content="AI-generated waste management and clean energy plans for Indian households and businesses." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Anti-FOUC: apply persisted theme before first paint -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            // Default to dark (matches app default)
            document.documentElement.classList.add('dark');
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
